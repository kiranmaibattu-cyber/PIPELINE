axelera-model-format: 1.0.0

name: alpr-vehicle-plate-lpr

description: ALL-AXELERA ALPR cascade — vehicle -> plate (ROI) -> LPRNet OCR (ROI), all 3 models on the Metis AIPU. LPRNet is the zoo model (Chinese charset placeholder; swap for an Indian-plate LPRNet later).

pipeline:
  - vehicle_detections:
      model_name: alpr-vehicle
      input:
        type: image
      preprocess:
        - letterbox:
            width: 640
            height: 640
            scaleup: true
        - torch-totensor:
      inference:
        handle_all: false
      postprocess:
        - decodeyolo10:
            box_format: xyxy
            conf_threshold: 0.4
            dfl_size: 1
            normalized_coord: false
            top_k: 300
            use_multi_label: false
  - plate_detections:
      model_name: alpr-plate
      input:
        type: image
        source: roi
        where: vehicle_detections
        which: AREA
        top_k: 10
        label_filter: [car, motorcycle, bus, truck]
      preprocess:
        - letterbox:
            width: 224
            height: 224
            scaleup: true
        - torch-totensor:
      inference:
        handle_all: false
      postprocess:
        - decodeyolo10:
            box_format: xyxy
            conf_threshold: 0.25
            dfl_size: 1
            normalized_coord: false
            top_k: 300
            use_multi_label: false
  - license_plate_ocr:
      model_name: lprnet
      input:
        type: image
        color_format: RGB
        source: roi
        where: plate_detections          # OCR runs on the plate boxes from stage 2
        which: SCORE
        top_k: 5
      preprocess:
        - resize:
            height: 24
            width: 94
        - torch-totensor:
            scale: false
        - normalize:
            mean: 127.5
            std: 128
      postprocess:
        - ctc-decoder:

operators:
  decodeyolo10:
    class: DecodeYolo10
    class_path: $AXELERA_FRAMEWORK/ax_models/decoders/yolo10.py

models:
  alpr-vehicle:
    class: AxONNXModel
    class_path: $AXELERA_FRAMEWORK/ax_models/base_onnx.py
    weight_path: /home/admin1/traffic-pilot/models/weights/vehicle_yolo26n_640.onnx
    task_category: ObjectDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 640, 640]
    input_color_format: RGB
    num_classes: 80
    dataset: AlprVehicleCal
    extra_kwargs:
      aipu_cores: 2
      compiler_config_file: yolo26.toml
  alpr-plate:
    class: AxONNXModel
    class_path: $AXELERA_FRAMEWORK/ax_models/base_onnx.py
    weight_path: /home/admin1/traffic-pilot/models/weights/plate_yolo26n_224.onnx
    task_category: ObjectDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 224, 224]
    input_color_format: RGB
    num_classes: 1
    dataset: AlprPlateCal
    extra_kwargs:
      aipu_cores: 1
      compiler_config_file: yolo26.toml
  lprnet:
    class: LPRNetTorchModel
    class_path: $AXELERA_FRAMEWORK/ax_models/torch/LPRNet.py
    weight_path: weights/Final_LPRNet_model.pth
    weight_url: https://media.axelera.ai/artifacts/model_cards/app_weights/license_plate_recog/Final_LPRNet_model.pth
    weight_md5: 1790d7e41cb14a18c051b181f8774708
    task_category: LicensePlateRecognition
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 24, 94]
    input_color_format: RGB
    num_classes: 68
    dataset: LPRNetDataset
    extra_kwargs:
      aipu_cores: 1
      trimmed_labels: false
      LPRNet:
        lpr_max_len: 8

datasets:
  AlprVehicleCal:
    class: ObjDataAdapter
    class_path: $AXELERA_FRAMEWORK/ax_datasets/objdataadapter.py
    data_dir_name: coco2017_repr400
    labels_path: $AXELERA_FRAMEWORK/ax_datasets/labels/coco.names
    label_type: COCO2017
  AlprPlateCal:
    class: ObjDataAdapter
    class_path: $AXELERA_FRAMEWORK/ax_datasets/objdataadapter.py
    data_dir_name: alpr_plate
    ultralytics_data_yaml: data.yaml
    label_type: YOLOv8
  LPRNetDataset:
    class: LPRNetDataAdapter
    class_path: $AXELERA_FRAMEWORK/ax_datasets/license_plate_recog.py
    data_dir_name: license_plate_recog
    labels_path: $AXELERA_FRAMEWORK/ax_datasets/labels/lprnet-char.yaml
