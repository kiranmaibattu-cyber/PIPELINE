services:
  edge-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.edge-agent
    image: pipeline-edge-agent:latest
    network_mode: host
    volumes:
      - ../configs:/configs
      - ../run/plans:/plans
      - ../models:/models-cache
      - /dev/dri:/dev/dri
      - /dev/accel:/dev/accel
    environment:
      EDGE_ID: intel-box-01
    command:
      - --desired-state
      - /configs/desired_state.json
      - --output-dir
      - /plans
      - --models-root
      - /models-cache
      - --host-models-root
      - ${PIPELINE_HOST_MODELS_ROOT:-/var/lib/pipeline/models}

  surveillance-runtime:
    build:
      context: ..
      dockerfile: docker/Dockerfile.surveillance
    image: surveillance-edge-runtime:intel-285h
    network_mode: host
    profiles: ["runtime"]
    volumes:
      - ../run/plans:/plans
      - ../run/generated/surveillance:/generated/surveillance
      - ../models/surveillance:/models/surveillance:ro
      - ../state/surveillance:/state/surveillance
      - /dev/dri:/dev/dri
      - /dev/accel:/dev/accel
    environment:
      APEX_API_PORT: "18090"

  traffic-runtime:
    build:
      context: ..
      dockerfile: docker/Dockerfile.traffic
    image: traffic-edge-runtime:intel-285h
    network_mode: host
    profiles: ["runtime"]
    volumes:
      - ../run/plans:/plans
      - ../run/generated/traffic:/generated/traffic
      - ../models/traffic:/models/traffic:ro
      - ../state/traffic:/state/traffic
      - /dev/dri:/dev/dri
      - /dev/accel:/dev/accel
    environment:
      APEX_API_PORT: "18091"
