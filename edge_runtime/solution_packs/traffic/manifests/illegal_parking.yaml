app_id: illegal_parking
solution_pack: traffic
version: 0.1.0
description: Parking violation from vehicle dwell time inside no-parking zones.
requires:
  data:
    - vehicle_tracks
    - parking_zone_geometry
models:
  - vehicle_detector
produces:
  events:
    - illegal_parking_event
hardware:
  preferred:
    vehicle_detector: GPU
    illegal_parking_app: CPU
policy:
  default_dwell_seconds: 150
