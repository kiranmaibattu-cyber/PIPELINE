axelera-model-format: 1.0.0

name: alpr-vehicle-plate

description: ALPR vehicle->plate cascade (yolo26n 640 master -> yolo26n 224 plate on vehicle ROIs), runs decode+both models in the SDK pipeline

pipeline:
  - vehicle_detections:
      model_name: alpr-vehicle
      input:
        type: image
      preprocess:
        - letterbox:
            width: 640
            height: 640
            scaleup: true
        - torch-totensor:
      inference:
        handle_all: false
      postprocess:
        - decodeyolo10:
            box_format: xyxy
            conf_threshold: 0.4
            dfl_size: 1
            normalized_coord: false
            top_k: 300
            use_multi_label: false
  - plate_detections:
      model_name: alpr-plate
      input:
        type: image
        source: roi
        where: vehicle_detections
        which: AREA                      # crop selection: largest-area ROIs first
        top_k: 10                        # up to 10 vehicle ROIs per frame
        label_filter: [car, motorcycle, bus, truck]   # only run plate-detect on vehicles
      preprocess:
        - letterbox:
            width: 224
            height: 224
            scaleup: true
        - torch-totensor:
      inference:
        handle_all: false
      postprocess:
        - decodeyolo10:
            box_format: xyxy
            conf_threshold: 0.25
            dfl_size: 1
            normalized_coord: false
            top_k: 300
            use_multi_label: false

operators:
  decodeyolo10:
    class: DecodeYolo10
    class_path: $AXELERA_FRAMEWORK/ax_models/decoders/yolo10.py

models:
  alpr-vehicle:
    class: AxONNXModel
    class_path: $AXELERA_FRAMEWORK/ax_models/base_onnx.py
    weight_path: /home/admin1/traffic-pilot/models/weights/vehicle_yolo26n_640.onnx
    task_category: ObjectDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 640, 640]
    input_color_format: RGB
    num_classes: 80
    dataset: AlprVehicleCal
    extra_kwargs:
      aipu_cores: 3                      # master/full-frame model gets 3 of 4 cores
      compiler_config_file: yolo26.toml
  alpr-plate:
    class: AxONNXModel
    class_path: $AXELERA_FRAMEWORK/ax_models/base_onnx.py
    weight_path: /home/admin1/traffic-pilot/models/weights/plate_yolo26n_224.onnx
    task_category: ObjectDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 224, 224]
    input_color_format: RGB
    num_classes: 1
    dataset: AlprPlateCal
    extra_kwargs:
      aipu_cores: 1                      # small 224 model on crops gets 1 core
      compiler_config_file: yolo26.toml

datasets:
  AlprVehicleCal:
    class: ObjDataAdapter
    class_path: $AXELERA_FRAMEWORK/ax_datasets/objdataadapter.py
    data_dir_name: alpr_vehicle
    labels_path: $AXELERA_FRAMEWORK/ax_datasets/labels/coco.names
    label_type: COCO2017
  AlprPlateCal:
    class: ObjDataAdapter
    class_path: $AXELERA_FRAMEWORK/ax_datasets/objdataadapter.py
    data_dir_name: alpr_plate
    ultralytics_data_yaml: data.yaml
    label_type: YOLOv8
