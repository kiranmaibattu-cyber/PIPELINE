name: sporada-secure
version: 2026.09.22-v16
contractVersion: v1
architectures: [amd64]
hardwareProfile: intel-285h
capabilities:
  apps:
    - anpr
    - vehicle_counting
    - vehicle_entry_exit_counts
    - pedestrian_counting
    - fire_smoke_detection
    - face_recognition
models:
  delivery: baked-in
  embedding:
    modelId: face-embedding-model-v1
    dimensions: 512
    compatibilityRule: exact-model-id-and-dimensions
configuration:
  desiredStatePath: /configs/desired_state.json
  schema: desired-state.schema.json
  compilerMode: runtime-internal-v1
  hotReload: {enabled: true, pollSeconds: 2, revisionPolicy: strictly-increasing, mountPath: /configs}
secrets:
  root: /run/secrets/apexfabric
  referenceFormat: file:/run/secrets/apexfabric/<camera-id>.url
  cameraSourceSchemes: [rtsp, rtsps, http, https]
  identityToken:
    environmentVariable: APEXFABRIC_FACE_IDENTITY_TOKEN
    kubernetesSecretKey: face-identity-token
network: {port: 8080, hostNetworkRequired: false}
endpoints:
  health: /healthz
  readiness: /readyz
  metrics: /metrics
  events: /events
  snapshots: /snapshots/<camera-id>/<filename>
eventProtocol: sse
eventSchema: analytics-event.schema.json
eventDelivery:
  mode: live-tail
  initialPosition: end-of-journal
  historicalReplay: disabled
  messageId: event_id
  heartbeatSeconds: 15
  reconnectBehavior: new-events-only
  guarantees: at-most-once
  note: vehicle_entry_exit_crossed is delivered through vehicleCrossingSubmission, not SSE
vehicleCrossingSubmission:
  purpose: durable authoritative delivery of one completed entry/exit crossing and its evidence frame
  method: POST
  url: http://apexfabric-ui.apexfabric.svc/internal/vehicle-crossings
  contentType: multipart/form-data
  authentication: {scheme: bearer, tokenEnvironmentVariable: APEXFABRIC_FACE_IDENTITY_TOKEN}
  parts:
    event: {contentType: application/json, schema: vehicle-crossing.schema.json, required: true}
    snapshot: {contentTypes: [image/jpeg, image/png], required: true, maximumBytes: 20971520}
  timeoutSeconds: 15
  maximumRequestBytes: 22020096
  idempotencyKey: event.event_id
  successStatuses: [200, 201]
  responseSchema: vehicle-crossing-response.schema.json
  retry:
    attempts: unlimited-while-outbox-record-is-retained
    backoff: exponential-with-jitter
    initialDelayMilliseconds: 250
    maximumDelaySeconds: 60
    retryStatuses: [408, 425, 429, 500, 502, 503, 504]
  durableOutbox:
    required: true
    persistBeforeFirstAttempt: true
    retryUsesSameEventId: true
    completionRule: remove-only-after-management-acknowledgement
  duplicationRule: do-not-also-emit-vehicle_entry_exit_crossed-on-sse
faceArtifactSubmission:
  method: POST
  urlTemplate: http://apexfabric-ui.apexfabric.svc/internal/face-artifacts/<sample-id>
  contentTypes: [image/jpeg, image/png]
  authentication: {scheme: bearer, tokenEnvironmentVariable: APEXFABRIC_FACE_IDENTITY_TOKEN}
  checksumHeader: X-ApexFabric-Artifact-SHA256
  checksumFormat: 'sha256:<64 lowercase hexadecimal characters>'
  timeoutSeconds: 15
  maximumRequestBytes: 20971520
  idempotencyKey: sample_id
  successStatuses: [200, 201]
  responseSchema: face-artifact-response.schema.json
  retry: {attempts: unlimited-while-outbox-record-is-retained, backoff: exponential-with-jitter, initialDelayMilliseconds: 250, maximumDelaySeconds: 60, retryStatuses: [408, 425, 429, 500, 502, 503, 504]}
identitySubmission:
  method: POST
  url: http://apexfabric-ui.apexfabric.svc/internal/face-samples
  contentType: application/json
  authentication: {scheme: bearer, tokenEnvironmentVariable: APEXFABRIC_FACE_IDENTITY_TOKEN}
  schema: face-sample.schema.json
  timeoutSeconds: 10
  maximumRequestBytes: 1048576
  retry: {attempts: unlimited-while-outbox-record-is-retained, backoff: exponential-with-jitter, initialDelayMilliseconds: 250, maximumDelaySeconds: 10, retryStatuses: [408, 429, 500, 502, 503, 504]}
  idempotencyKey: sample_id
  requiresAcknowledgedArtifact: true
  runtimeUsesReturnedPersonId: false
faceEmission:
  newTrack: required
  qualityGate: required
  materialChangeGate: required
  cooldown: required
  oneSampleIdPerObservation: required
  sharedEventIdForTelemetryAndEmbedding: required
  durableOutbox:
    required: true
    completionRule: remove-only-after-artifact-and-embedding-acknowledgements
    retryUsesSameSampleId: true
process: {uid: 10001, gid: 10001, readOnlyRootSupported: true}
resources: {cpuRequest: '8', memoryRequest: 16Gi, maxCameraStreams: 8}
accelerators: [intel-igpu, intel-npu]
devices: [/dev/dri, /dev/accel]
storage:
  persistentVolumes:
    - {mountPath: /state, purpose: event journal, durable upload outboxes, and retained snapshot evidence}
  snapshotRetention: {root: /state/snapshots, highBytes: 8589934592, lowBytes: 6442450944, maximumAgeSeconds: 86400, scanSeconds: 60}
  eventJournalRetention: {path: /state/events/analytics.jsonl, rotateAtBytes: 536870912, retainedFiles: 2, maximumTotalBytes: 1073741824, rotation: atomic-rename, liveTailReopenAfterRotation: required}
  temporaryPaths: [/plans, /tmp/apexfabric]
externalDependencies:
  - {name: apex-fabric-face-identity, type: cluster-service, required: true}
privacy:
  rawEmbeddingInEvents: forbidden
  rawEmbeddingInLogs: forbidden
  personDatabaseAccess: forbidden
  runtimeAssignedPersonId: forbidden
  faceCropRequired: true
  faceCropDelivery: authenticated-central-upload
ui:
  included: false
  displayName: Sporada Secure with Face Recognition and Entry/Exit Counts
  description: ANPR, vehicle and people counting, smoke/fire detection, and server-clustered face recognition.
  camera:
    defaultFps: 8
    defaultApp: vehicle_counting
    apps:
      anpr: {label: Number plate recognition, symbol: ID, geometry: {kind: zone, label: ANPR zone, configPath: zones.anpr, points: 4, required: false, nameTemplate: '{app}_zone', idTemplate: '{camera_id}-{app}-zone'}}
      vehicle_counting: {label: Vehicles currently in frame, symbol: VC, geometry: {kind: zone, label: Vehicle counting zone, configPath: zones.vehicle_counting, points: 4, required: false, nameTemplate: '{app}_zone', idTemplate: '{camera_id}-{app}-zone'}}
      vehicle_entry_exit_counts:
        label: Vehicle entry / exit counts
        symbol: EE
        geometry:
          kind: line
          label: Entry / exit counting line
          configPath: counting_lines.vehicle_entry_exit_counts
          points: 2
          required: true
          directional: true
          endpointLabels: {first: A, second: B}
          orientationHelp: Draw A then B. Looking from A toward B, the left side is IN and the right side is OUT. Reverse A and B to swap the sides.
          nameTemplate: '{app}_line'
          idTemplate: '{camera_id}-{app}-line'
          values:
            direction_mapping: {right_to_left: in, left_to_right: out}
            vehicle_classes: [car, truck, bus, motorcycle]
            minimum_track_age_frames: 3
            minimum_crossing_displacement: 0.02
            crossing_cooldown_seconds: 10
      pedestrian_counting: {label: People counting, symbol: PC, geometry: {kind: zone, label: People counting zone, configPath: zones.pedestrian_counting, points: 4, required: false, nameTemplate: '{app}_zone', idTemplate: '{camera_id}-{app}-zone'}}
      fire_smoke_detection: {label: Smoke and fire detection, symbol: FS, geometry: {kind: zone, label: Fire and smoke zone, configPath: zones.fire_smoke_detection, points: 4, required: false, nameTemplate: '{app}_zone', idTemplate: '{camera_id}-{app}-zone'}}
      face_recognition: {label: Face recognition, symbol: FR, geometry: {kind: zone, label: Face detection zone, configPath: zones.face_recognition, points: 4, required: false, nameTemplate: '{app}_zone', idTemplate: '{camera_id}-{app}-zone'}}
  deployment: {storageGi: 20, cpuRequest: 8, cpuLimit: 16, memoryRequestGi: 16, memoryLimitGi: 32, pullPolicy: IfNotPresent, inferenceMode: intel-gpu-npu}
