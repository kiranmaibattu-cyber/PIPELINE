solution_pack: traffic
image: traffic-edge-runtime:intel-285h
hardware_profile: intel-285h
camera_model: platform-managed
max_streams_per_instance: 26
endpoints:
  liveness:
    path: /healthz
    port: 8080
    format: application/json
  readiness:
    path: /readyz
    port: 8080
    format: application/json
  metrics:
    path: /metrics
    port: 8080
    format: application/json
  analytics_events:
    path: /events
    port: 8080
    protocol: server-sent-events
    format: text/event-stream
  alert_snapshots:
    path_prefix: /snapshots/
    port: 8080
    format: image/jpeg
inputs:
  cameras:
    source: mounted_file_or_secret
    plan_path: /plans/traffic.runtime_plan.json
    accepted_source_refs:
      - env:CAMERA_RTSP_ENV_NAME
      - file:/mounted/secret/path
      - secret:/mounted/secret/path
  models:
    mount_path: /models/traffic/openvino
    required: true
storage:
  durable_config:
    mount_path: /state/traffic
    contains:
      - rules
      - runtime_history
    sizing_hint: "1-10 GB depending on analytics retention"
  cache:
    mount_path: /state/traffic
    sizing_hint: "optional live/snapshot retention dependent"
    serves:
      - /state/traffic/snapshots
      - /state/traffic/crops
devices:
  required:
    - /dev/dri
    - /dev/accel
runtime:
  no_internet_required: true
  writes_inside_image: false
  graceful_sigterm: true
